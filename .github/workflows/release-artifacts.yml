name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to stamp into the artifacts.
        type: string
        required: false
        default: 0.1.0-dev
  workflow_call:
    inputs:
      version:
        description: Semantic version to stamp into the artifacts.
        type: string
        required: true

jobs:
  publish-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: bash build.sh PublishApi --release-version "${{ inputs.version }}"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-api
          path: artifacts/publish/api/
          if-no-files-found: error

      # The Dockerfile copies the health probe alongside the API, so it has to travel with the API in
      # the release bundle. Without it, the Docker release job would fail the EnsurePublishApiArtifacts
      # check and silently republish both projects instead of reusing these stamped artifacts.
      - name: Upload health probe artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-health-probe
          path: artifacts/publish/health-probe/
          if-no-files-found: error

  # Builds inside Microsoft's NativeAOT cross-build images instead of on the runner. The runner's own
  # libc is not usable: ubuntu-latest installs the amd64v3 package variant, whose crt1.o carries an
  # x86-64-v3 ISA note that the linker copies into the binary and that glibc enforces at startup. The
  # images link against an Ubuntu 18.04 sysroot (/crossrootfs/<arch>) without such markers, which also
  # keeps the glibc requirement low. Both run on an x86_64 host; arm64 is a cross build there.
  publish-cli-linux:
    strategy:
      matrix:
        include:
          # renovate: datasource=docker depName=mcr.microsoft.com/dotnet-buildtools/prereqs versioning=loose
          - image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64@sha256:3d9b12839eb1352678e577c3fada879ea1e92fe5923da4d260786e7b6d7b0075
            runtime: linux-x64
            target: PublishCliLinuxX64
          # renovate: datasource=docker depName=mcr.microsoft.com/dotnet-buildtools/prereqs versioning=loose
          - image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64@sha256:15c15aac729f136bc69c32bdb2582324a226f19bcabf24cb4d283b1bacbc2ff9
            runtime: linux-arm64
            target: PublishCliLinuxArm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The images ship no .NET SDK; build.sh installs the one pinned in global.json.
      - name: Publish Linux CLI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env RELEASE_VERSION \
            ${{ matrix.image }} \
            bash -lc '
              git config --global --add safe.directory /workspace &&
              bash build.sh ${{ matrix.target }} --release-version "$RELEASE_VERSION"
            '

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-cli-${{ matrix.runtime }}
          path: artifacts/publish/cli/*/shadowdrop-*-${{ matrix.runtime }}
          if-no-files-found: error

  publish-cli-linux-musl:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            runtime: linux-musl-x64
            target: PublishCliLinuxMuslX64
          - runner: ubuntu-24.04-arm
            runtime: linux-musl-arm64
            target: PublishCliLinuxMuslArm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish Linux musl CLI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env RELEASE_VERSION \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -lc '
              apk add --no-cache bash git clang lld build-base zlib-dev &&
              git config --global --add safe.directory /workspace &&
              bash build.sh ${{ matrix.target }} --release-version "$RELEASE_VERSION"
            '

      - name: Upload Linux musl CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-cli-${{ matrix.runtime }}
          path: artifacts/publish/cli/*/shadowdrop-*-${{ matrix.runtime }}
          if-no-files-found: error

  publish-cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish macOS CLI
        run: bash build.sh PublishCliMacOs --release-version "${{ inputs.version }}"

      - name: Upload macOS CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-cli-macos
          path: artifacts/publish/cli/*/shadowdrop-*-osx-*
          if-no-files-found: error

  publish-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows CLI
        run: ./build.cmd PublishCliWindows --release-version "${{ inputs.version }}"

      - name: Upload Windows CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-cli-windows
          path: artifacts/publish/cli/*/shadowdrop-*-win-*.exe
          if-no-files-found: error

  collect-release-artifacts:
    runs-on: ubuntu-latest
    needs:
      - publish-api
      - publish-cli-linux
      - publish-cli-linux-musl
      - publish-cli-macos
      - publish-cli-windows
    steps:
      - name: Download published artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/downloaded

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/release/api artifacts/release/cli artifacts/release/health-probe
          cp -R artifacts/downloaded/shadowdrop-api/. artifacts/release/api/
          cp -R artifacts/downloaded/shadowdrop-health-probe/. artifacts/release/health-probe/
          find artifacts/downloaded -type f -name 'shadowdrop-*' -exec cp {} artifacts/release/cli/ \;

          expected_count=8
          actual_count="$(find artifacts/release/cli -maxdepth 1 -type f -name 'shadowdrop-*' | wc -l)"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "Expected $expected_count CLI artifacts but found $actual_count."
            find artifacts/release/cli -maxdepth 1 -type f -name 'shadowdrop-*' -print
            exit 1
          fi

          (
            cd artifacts/release/cli
            sha256sum shadowdrop-* > CHECKSUMS.sha256
          )

      - name: Upload complete release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: shadowdrop-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
